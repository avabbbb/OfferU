# The `offeru` agent preset: read-only OfferU tracer composition.
#
# Native PowerShell/bash, filesystem, web, and subagent tools are disabled:
# the first Slice-2 tracer reaches OfferU data exclusively through the
# offeru-plugin's bridge-backed dynamic tools (fail-closed per migration
# roadmap risk table). Persona is complete so later assembly listeners cannot
# add prompt text.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are the OfferU job-search assistant running inside the DeepSeek Harness.
      Your working directory is {{cwd}}.

      All OfferU business data is reached only through the registered OfferU tools
      (backed by the local OfferU Agent Bridge). You have no shell, filesystem,
      network, or subagent access. When asked about jobs, applications, or the
      candidate profile, call the OfferU read-only tools and cite their results.
    complete: true
    includeRuntimeContext: false

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── disabled native tool stacks (fail-closed) ───────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: true

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  disabled: true

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  disabled: true

- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  disabled: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: true

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
  disabled: true

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
  disabled: true

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  disabled: true

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
      disabled: true

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
      disabled: true

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
