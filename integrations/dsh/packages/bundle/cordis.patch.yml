# The OfferU bundle patch: rides over dsh-base + dsh-web-app layers.
# Adds the OfferU dual-face plugin (host bridge client + browser workbench view)
# to the browser roster. Patch rows replace targeted config wholesale; inserts
# append new rows.
#
# The plugin row is a plain host row: its node half starts `offeru bridge
# --stdio` and exposes harness.handle RPCs; the browser half is discovered via
# its dsh.client manifest through @deepseek-ai/dsh-client-modules.

insert:
  - id: offeru-plugin
    name: '@offeru/dsh-plugin'
