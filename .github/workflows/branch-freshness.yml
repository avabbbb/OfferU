name: PR Baseline Freshness

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-freshness:
    name: PR includes latest main
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch current base
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      # Advisory only: a PR behind main is reported as a warning instead of
      # failing. GitHub's merge ref already tests the PR merged onto main.
      - name: Warn on stale PR baseline (advisory)
        shell: bash
        run: |
          if ! python backend/scripts/dev/branch_guard.py \
            --mode pr \
            --base-ref "origin/${{ github.event.pull_request.base.ref }}" \
            --no-fetch; then
            echo "::warning title=PR baseline is behind main::This PR does not include the latest main. Consider rebasing/merging main before merge; this check is advisory and does not block."
          fi
