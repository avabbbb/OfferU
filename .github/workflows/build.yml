name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # 重活（安装包、安装后冒烟）不再跟每次 main 推送跑，改为每天 05:00 CST 一次 + 打 tag + 手动触发。
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish the verified installers as an unsigned Owner Dogfood prerelease
        type: boolean
        default: false
      owner_trial:
        description: Build a manual owner trial; browser acceptance may be failed and is explicitly disclosed
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      ts_backend: ${{ steps.filter.outputs.ts_backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      extension: ${{ steps.filter.outputs.extension }}
      tauri: ${{ steps.filter.outputs.tauri }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: filter
        name: Classify changed paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/offeru-changed-files.txt"
          flag() {
            if grep -Eq "$1" "$RUNNER_TEMP/offeru-changed-files.txt"; then echo true; else echo false; fi
          }
          {
            echo "ts_backend=$(flag '^(backend-ts/|packages/core/)')"
            echo "frontend=$(flag '^(frontend/|packages/core/)')"
            echo "extension=$(flag '^extension/')"
            echo "tauri=$(flag '^frontend/src-tauri/')"
            echo "ci=$(flag '^(\.github/workflows/|AGENTS\.md$|scripts/)')"
          } >> "$GITHUB_OUTPUT"

  release-audits:
    name: Release audits
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit release version consistency
        run: node scripts/release/audit_version_consistency.mjs --repo-root . --json

      - name: Audit release-facing product claims
        if: ${{ github.event_name != 'pull_request' }}
        run: node scripts/release/audit_product_claims.mjs --repo-root . --json

      - name: Audit release severity ledger
        if: ${{ github.event_name != 'pull_request' }}
        run: node scripts/release/audit_release_severity.mjs --repo-root . --json

      - name: Audit release checklist semantics
        if: ${{ github.event_name != 'pull_request' }}
        run: node scripts/release/audit_release_readiness.mjs --repo-root . --json

  backend-ts-tests:
    name: TS backend tests
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ts_backend == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend-ts/package-lock.json

      - name: Install TS backend dependencies
        working-directory: backend-ts
        run: npm ci

      - name: Typecheck TS backend
        working-directory: backend-ts
        run: npm run typecheck

      - name: Run TS backend tests
        working-directory: backend-ts
        run: npm test

  frontend-quality:
    name: Frontend typecheck and build
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Design audit must compare the full PR against its base.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend-ts/package-lock.json

      # The web build and the typecheck compile backend-ts/src (in-page backend), so both need their dependencies.
      - name: Install frontend and TS backend dependencies
        run: |
          npm --prefix backend-ts ci
          npm --prefix frontend ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Test visual design audit rules
        working-directory: frontend
        run: npm run design:audit:test

      - name: Gate newly introduced UI style debt
        working-directory: frontend
        env:
          DESIGN_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run design:audit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit production dependencies
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  rust-security-audit:
    name: RustSec dependency audit
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.tauri == 'true' || needs.changes.outputs.ci == 'true' }}
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Enforce RustSec policy and scoped Linux exception
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python3 scripts/ci/check_rustsec.py

      - name: Deny all unsound findings on release tags
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        working-directory: frontend/src-tauri
        run: cargo audit --deny unsound --format json

  extension-quality:
    name: Browser extension typecheck, test and build
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.extension == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Typecheck extension
        working-directory: extension
        run: npm run typecheck

      - name: Test extension
        working-directory: extension
        run: npm test

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Audit extension production dependencies
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        working-directory: extension
        run: npm audit --omit=dev --audit-level=high

  companion-smoke:
    name: TS companion and workbench smoke
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ts_backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend-ts/package-lock.json
            frontend/package-lock.json

      - name: Install smoke dependencies
        run: |
          npm --prefix backend-ts ci
          npm --prefix frontend ci
          node backend-ts/node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Start isolated frontend
        shell: bash
        run: |
          nohup npm --prefix frontend run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/offeru-frontend.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:7410/ | grep -q OfferU && break; sleep 1; done

      - name: Run companion and workbench smoke
        env:
          OFFERU_E2E_BASE_URL: http://127.0.0.1:7410
          OFFERU_E2E_ARTIFACT_DIR: ${{ runner.temp }}/offeru-e2e-artifacts
        run: node scripts/e2e/smoke.mjs

      - name: Bundle the desktop sidecar and smoke the bundle
        shell: bash
        run: |
          set -euo pipefail
          node backend-ts/scripts/bundle.mjs "$RUNNER_TEMP/offeru-bundle"
          NODE_NO_WARNINGS=1 OFFERU_DATA_DIR="$RUNNER_TEMP/offeru-bundle-data" node "$RUNNER_TEMP/offeru-bundle/cli.mjs" doctor | grep -q '"ok":true'

      - name: Audit runtime diagnostics for secrets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          audit_root="$RUNNER_TEMP/offeru-smoke-diagnostics"
          mkdir -p "$audit_root"
          if [ -d "$RUNNER_TEMP/offeru-e2e-artifacts" ]; then cp -R "$RUNNER_TEMP/offeru-e2e-artifacts" "$audit_root/e2e-artifacts"; fi
          if [ -f "$RUNNER_TEMP/offeru-frontend.log" ]; then cp "$RUNNER_TEMP/offeru-frontend.log" "$audit_root/frontend.log"; fi
          node scripts/release/audit_artifacts.mjs "$audit_root" --json | tee "$RUNNER_TEMP/offeru-smoke-audit.json"

      - name: Upload smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offeru-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/offeru-e2e-artifacts
            ${{ runner.temp }}/offeru-frontend.log
          if-no-files-found: ignore

  desktop-package:
    # Every push to main builds installers once the fast checks pass. The slow
    # browser matrices still gate tagged releases (see `release`), but a flaky
    # browser test no longer stops testers from getting a build.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && needs.release-audits.result == 'success' && needs.backend-ts-tests.result == 'success' && needs.frontend-quality.result == 'success' }}
    name: Windows desktop package
    runs-on: windows-latest
    needs: [release-audits, backend-ts-tests, frontend-quality]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend-ts/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install build dependencies
        shell: pwsh
        run: |
          npm --prefix frontend ci
          npm --prefix backend-ts ci

      - name: Enforce Public Release readiness before packaging
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: node scripts/release/audit_release_readiness.mjs --repo-root . --require-ready

      - name: Audit release version consistency before packaging
        shell: pwsh
        run: node scripts/release/audit_version_consistency.mjs --repo-root .

      - name: Build and verify Windows installer
        shell: pwsh
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run tauri -- build --bundles nsis,msi

      - name: Sign Windows release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          OFFERU_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.OFFERU_WINDOWS_CERTIFICATE_BASE64 }}
          OFFERU_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.OFFERU_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:OFFERU_WINDOWS_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:OFFERU_WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Release tags require OFFERU_WINDOWS_CERTIFICATE_BASE64 and OFFERU_WINDOWS_CERTIFICATE_PASSWORD; refusing to publish unsigned binaries.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'offeru-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:OFFERU_WINDOWS_CERTIFICATE_BASE64))
            $signtoolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($null -ne $signtoolCommand) {
              $signtoolPath = $signtoolCommand.Source
            } else {
              $windowsKitRoots = @(
                (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'),
                (Join-Path $env:ProgramFiles 'Windows Kits\10\bin')
              ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
              $signtoolPath = Get-ChildItem -Path $windowsKitRoots -Filter signtool.exe -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if ([string]::IsNullOrWhiteSpace($signtoolPath)) {
              throw 'signtool.exe was not found on the Windows runner'
            }
            $files = @(
              Get-ChildItem frontend/src-tauri/target/release/bundle -Recurse -File -Include *.exe,*.msi
              Get-ChildItem frontend/src-tauri/binaries/*.exe -File
            ) | Sort-Object FullName -Unique
            if ($files.Count -eq 0) { throw 'No Windows binaries were found to sign' }
            foreach ($file in $files) {
              & $signtoolPath sign /fd SHA256 /f $certificatePath /p $env:OFFERU_WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($file.Name)" }
            }
          } finally {
            if (Test-Path -LiteralPath $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }
          }

      - name: Verify Windows release signatures
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            Get-ChildItem frontend/src-tauri/target/release/bundle -Recurse -File -Include *.exe,*.msi
            Get-ChildItem frontend/src-tauri/binaries/*.exe -File
          ) | Sort-Object FullName -Unique
          if ($files.Count -eq 0) { throw 'No signed Windows binaries were found to verify' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Unsigned or invalid signature: $($file.FullName) [$($signature.Status)]" }
          }

      - name: Collect release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $arguments = @('frontend/src-tauri/target/release/bundle', 'release-artifacts', '--version', [string]$version, '--target', 'windows-x64')
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $arguments += '--signed' }
          node scripts/release/collect_release_artifacts.mjs @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release artifact collection failed' }

      - name: Verify release artifact manifest and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $arguments = @('release-artifacts', '--expected-version', [string]$version)
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $arguments += '--require-signed' }
          node scripts/release/verify_release_artifacts.mjs @arguments
          if ($LASTEXITCODE -ne 0) { throw "release artifact verification failed with exit code $LASTEXITCODE" }

      - name: Audit release artifacts for secrets
        shell: pwsh
        run: |
          node scripts/release/audit_artifacts.mjs frontend/src-tauri/target/release/bundle --json
          node scripts/release/audit_artifacts.mjs frontend/src-tauri/binaries --json
          node scripts/release/audit_artifacts.mjs release-artifacts --json

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: offeru-windows-x64
          path: release-artifacts
          if-no-files-found: error

  macos-package:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    needs: [release-audits, backend-ts-tests, frontend-quality, extension-quality]
    uses: ./.github/workflows/macos-package.yml
    secrets: inherit

  desktop-installed-smoke:
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && needs.desktop-package.result == 'success' }}
    name: Windows installed-app and sidecar smoke
    runs-on: windows-latest
    needs: [desktop-package]

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: offeru-windows-x64
          path: release-assets

      - name: Verify downloaded installer artifact before install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content release-assets/version.json -Raw | ConvertFrom-Json).version
          $arguments = @('release-assets', '--expected-version', [string]$version)
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $arguments += '--require-signed' }
          node scripts/release/verify_release_artifacts.mjs @arguments
          if ($LASTEXITCODE -ne 0) { throw "downloaded installer artifact verification failed with exit code $LASTEXITCODE" }

      - name: Audit downloaded installer artifact for secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/release/audit_artifacts.mjs release-assets --json
          if ($LASTEXITCODE -ne 0) { throw "downloaded installer artifact secret audit failed with exit code $LASTEXITCODE" }

      - name: Install, launch, health-check and uninstall NSIS package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'offeru-clean-machine'
          $installRoot = Join-Path $artifactRoot 'installed'
          $resultPath = Join-Path $artifactRoot 'result.json'
          $expectedVersion = [string]((Get-Content (Join-Path $env:GITHUB_WORKSPACE 'release-assets/version.json') -Raw | ConvertFrom-Json).version)
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) { throw 'release artifact version is missing' }
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          if (Test-Path -LiteralPath $installRoot) {
            Remove-Item -LiteralPath $installRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          $appProcess = $null
          $healthHandler = [System.Net.Http.HttpClientHandler]::new()
          $healthHandler.AllowAutoRedirect = $false
          $healthHandler.UseProxy = $false
          $healthClient = [System.Net.Http.HttpClient]::new($healthHandler)
          $healthClient.Timeout = [TimeSpan]::FromSeconds(3)
          $summary = [ordered]@{
            status = 'FAIL'
            mode = 'windows_installed_app_smoke'
            browser = 'none'
            web_url = 'not_used'
            api_url = 'http://127.0.0.1:8766'
            expected_version = $expectedVersion
          }
          try {
            $preexistingListeners = @(
              Get-NetTCPConnection -State Listen -LocalPort 8766 -ErrorAction SilentlyContinue
            )
            if ($preexistingListeners.Count -gt 0) {
              $ownerIds = @($preexistingListeners | Select-Object -ExpandProperty OwningProcess -Unique)
              throw "port 8766 is already occupied before installed-app smoke (PID(s): $($ownerIds -join ', '))"
            }

            $installer = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'release-assets') -Filter 'OfferU-Setup-*.exe' -File -Recurse |
              Select-Object -First 1
            if ($null -eq $installer) { throw 'NSIS installer artifact was not found' }
            $installerRun = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") -WindowStyle Hidden -PassThru -Wait
            if ($installerRun.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($installerRun.ExitCode)" }

            # Tauri uses the Cargo package name (`app`) for this executable;
            # productName (`OfferU`) controls the user-facing installer name.
            $app = Get-ChildItem -Path $installRoot -Filter 'app.exe' -File -Recurse | Select-Object -First 1
            if ($null -eq $app) { throw "installed app.exe was not found under $installRoot" }
            $appProcess = Start-Process -FilePath $app.FullName -WindowStyle Hidden -PassThru

            $deadline = (Get-Date).AddSeconds(60)
            $health = $null
            while ((Get-Date) -lt $deadline) {
              try {
                $healthResponse = $healthClient.GetAsync('http://127.0.0.1:8766/api/health').GetAwaiter().GetResult()
                if ($healthResponse.IsSuccessStatusCode) {
                  $health = $healthResponse.Content.ReadAsStringAsync().GetAwaiter().GetResult() | ConvertFrom-Json
                  if ($health.status -eq 'ok' -and
                      $health.service -eq 'OfferU' -and
                      $health.runtime -eq 'node' -and
                      $health.build_mode -eq 'release' -and
                      $health.version -eq $expectedVersion) { break }
                }
                $healthResponse.Dispose()
              } catch {
                # The sidecar can take a few seconds to unpack and bind. A
                # redirect is deliberately treated as a failed probe.
              }
              Start-Sleep -Milliseconds 500
            }
            if ($null -eq $health -or
                $health.status -ne 'ok' -or
                $health.service -ne 'OfferU' -or
                $health.runtime -ne 'node' -or
                $health.build_mode -ne 'release' -or
                $health.version -ne $expectedVersion) {
              throw 'installed app did not expose a healthy 8766 sidecar within 60 seconds'
            }
            $listeners = @(
              Get-NetTCPConnection -State Listen -LocalPort 8766 -ErrorAction SilentlyContinue
            )
            $sidecarOwnerPaths = @(
              foreach ($listener in $listeners) {
                $owner = Get-CimInstance Win32_Process -Filter "ProcessId = $($listener.OwningProcess)" -ErrorAction SilentlyContinue
                if ($null -ne $owner -and $owner.ExecutablePath) { $owner.ExecutablePath }
              }
            )
            $ownedSidecarPath = $sidecarOwnerPaths |
              Where-Object { $_.StartsWith($installRoot, [System.StringComparison]::OrdinalIgnoreCase) } |
              Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($ownedSidecarPath)) {
              throw 'healthy 8766 endpoint is not owned by the installed app directory'
            }
            $summary.status = 'PASS'
            $summary.installer = $installer.Name
            $summary.installed_executable = $app.FullName
            $summary.health_status = $health.status
            $summary.health_service = $health.service
            $summary.health_runtime = $health.runtime
            $summary.health_build_mode = $health.build_mode
            $summary.health_version = $health.version
            $summary.sidecar_port = 8766
            $summary.sidecar_executable = $ownedSidecarPath

            # The folder NSIS just installed (and that passed the health check)
            # is exactly what a no-install build needs. Zip it before uninstalling.
            $portableRoot = Join-Path $artifactRoot 'portable-staging/OfferU'
            New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
            Get-ChildItem -LiteralPath $installRoot -Force |
              Where-Object { $_.Name -ne 'uninstall.exe' } |
              Copy-Item -Destination $portableRoot -Recurse -Force
            Rename-Item -LiteralPath (Join-Path $portableRoot 'app.exe') -NewName 'OfferU.exe'
            $portableZip = Join-Path $env:GITHUB_WORKSPACE "portable/OfferU-$expectedVersion-windows-x64-portable.zip"
            New-Item -ItemType Directory -Force -Path (Split-Path $portableZip) | Out-Null
            Compress-Archive -Path $portableRoot -DestinationPath $portableZip -Force
          } catch {
            $summary.error = $_.Exception.Message
            throw
          } finally {
            $ownedPids = @()
            if ($null -ne $appProcess) { $ownedPids += $appProcess.Id }
            $ownedPids += @(
              Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.ExecutablePath -and
                  $_.ExecutablePath.StartsWith($installRoot, [System.StringComparison]::OrdinalIgnoreCase)
                } |
                Select-Object -ExpandProperty ProcessId
            )
            foreach ($processId in ($ownedPids | Sort-Object -Unique)) {
              Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue
            }
            $uninstaller = Get-ChildItem -Path $installRoot -Filter 'uninstall.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -ne $uninstaller) {
              $uninstallRun = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/S') -WindowStyle Hidden -PassThru -Wait
              if ($uninstallRun.ExitCode -ne 0 -and $summary.status -eq 'PASS') {
                $summary.status = 'FAIL'
                $summary.error = "NSIS uninstaller failed with exit code $($uninstallRun.ExitCode)"
              }
            } elseif ($summary.status -eq 'PASS') {
              $summary.status = 'FAIL'
              $summary.error = 'installed NSIS uninstaller was not found'
            }
            $healthClient.Dispose()
            $healthHandler.Dispose()
            $summary | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $resultPath -Encoding utf8
          }
          if ($summary.status -ne 'PASS') {
            throw [System.InvalidOperationException]::new([string]($summary.error ?? 'installed-app smoke failed'))
          }

      - name: Unzip and launch the portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem -Path portable -Filter '*-portable.zip' -File | Select-Object -First 1
          if ($null -eq $zip) { throw 'portable zip was not produced' }
          $runRoot = Join-Path $env:RUNNER_TEMP 'offeru-portable-run'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $runRoot -Force
          $exe = Join-Path $runRoot 'OfferU/OfferU.exe'
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-NetTCPConnection -State Listen -LocalPort 8766 -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          $process = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $healthy = $false
            while (-not $healthy -and (Get-Date) -lt $deadline) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8766/api/health' -TimeoutSec 3 -NoProxy
                $healthy = $health.status -eq 'ok' -and $health.service -eq 'OfferU'
              } catch {
                # Backend still unpacking / binding.
              }
              if (-not $healthy) { Start-Sleep -Milliseconds 500 }
            }
            if (-not $healthy) { throw 'portable OfferU.exe did not bring up a healthy backend within 60 seconds' }
            $owner = Get-NetTCPConnection -State Listen -LocalPort 8766 |
              ForEach-Object { (Get-CimInstance Win32_Process -Filter "ProcessId = $($_.OwningProcess)").ExecutablePath } |
              Where-Object { $_ -and $_.StartsWith($runRoot, [System.StringComparison]::OrdinalIgnoreCase) } |
              Select-Object -First 1
            if (-not $owner) { throw 'the healthy backend is not the one inside the unzipped folder' }
            "Portable build OK: $($zip.Name), backend $owner" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          } finally {
            Get-CimInstance Win32_Process |
              Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($runRoot, [System.StringComparison]::OrdinalIgnoreCase) } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: offeru-windows-x64-portable
          path: portable/*.zip
          if-no-files-found: error

      - name: Upload installed-app smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offeru-installed-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/offeru-clean-machine/result.json
          if-no-files-found: ignore

  release:
    name: Publish verified installer assets
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_candidate)) && needs.release-audits.result == 'success' && needs.backend-ts-tests.result == 'success' && needs.frontend-quality.result == 'success' && needs.extension-quality.result == 'success' && needs.rust-security-audit.result == 'success' && needs.desktop-package.result == 'success' && needs.desktop-installed-smoke.result == 'success' && needs.macos-package.result == 'success' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_candidate && inputs.owner_trial) || needs.companion-smoke.result == 'success') }}
    needs: [release-audits, backend-ts-tests, frontend-quality, extension-quality, rust-security-audit, companion-smoke, desktop-package, desktop-installed-smoke, macos-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read artifact version
        id: artifact_version
        shell: bash
        run: echo "version=$(node -p 'require("./frontend/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Enforce Public Release readiness before publishing
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release/audit_release_readiness.mjs --repo-root . --require-ready

      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: offeru-windows-x64
          path: release-assets/windows-x64

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: offeru-macos-*
          path: release-assets

      - name: Download Windows portable build
        uses: actions/download-artifact@v4
        with:
          name: offeru-windows-x64-portable
          path: release-assets/portable

      - name: Verify downloaded release artifact manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${{ steps.artifact_version.outputs.version }}"
          signed_arguments=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_version="${GITHUB_REF_NAME#v}"
            signed_arguments=(--require-signed)
          fi
          for artifact in release-assets/windows-x64 release-assets/offeru-macos-arm64 release-assets/offeru-macos-x64; do
            node scripts/release/verify_release_artifacts.mjs "$artifact" --expected-version "$expected_version" "${signed_arguments[@]}"
            platform=$(basename "$artifact")
            cp "$artifact/artifacts.json" "release-assets/artifacts-$platform.json"
            cp "$artifact/version.json" "release-assets/version-$platform.json"
          done
          cat release-assets/*/SHA256SUMS.txt > release-assets/SHA256SUMS.txt

      - name: Audit downloaded release artifact for secrets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/audit_artifacts.mjs release-assets --json

      - name: Publish installer assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('dogfood-{0}-{1}', steps.artifact_version.outputs.version, github.run_number) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_candidate && inputs.owner_trial) && format('OfferU {0} Manual Owner Trial', steps.artifact_version.outputs.version) || (github.event_name == 'workflow_dispatch' && format('OfferU {0} Owner Dogfood', steps.artifact_version.outputs.version) || format('OfferU {0}', github.ref_name)) }}
          draft: ${{ github.event_name != 'workflow_dispatch' }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          make_latest: false
          body: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_candidate && inputs.owner_trial) && 'MANUAL OWNER TRIAL - full browser acceptance has not passed; the known Role Intelligence panel visibility flake is unresolved. Core, security, migration, recovery, artifact and installed-app checks remain required. Unsigned Windows installer; not a stable public release.' || (github.event_name == 'workflow_dispatch' && 'Owner Dogfood prerelease. Installers are built and tested by GitHub Actions from the target commit. Windows installers are unsigned; full Public Release readiness and human product acceptance remain outstanding. This is not a stable public release.' || '') }}
          generate_release_notes: true
          files: |
            release-assets/windows-x64/*.exe
            release-assets/windows-x64/*.msi
            release-assets/portable/*.zip
            release-assets/offeru-macos-*/*.dmg
            release-assets/SHA256SUMS.txt
            release-assets/artifacts-*.json
            release-assets/version-*.json
            release-assets/windows-x64/CHANGELOG.md
            release-assets/windows-x64/THIRD_PARTY_NOTICES.md
            release-assets/windows-x64/LICENSE

  nightly:
    name: Publish rolling nightly build
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' && needs.desktop-installed-smoke.result == 'success' && needs.macos-package.result == 'success' }}
    needs: [desktop-installed-smoke, macos-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: offeru-nightly
      cancel-in-progress: true
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: offeru-windows-x64
          path: assets/windows
      - name: Download Windows portable build
        uses: actions/download-artifact@v4
        with:
          name: offeru-windows-x64-portable
          path: assets/portable
      - name: Download macOS DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: offeru-macos-*
          path: assets/macos
      - name: Replace the nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          cat > notes.md <<EOF
          每次合进 main 自动打包，提交 ${short_sha}。没有签名，只给内测用。

          - **Windows 安装版**：\`OfferU-Setup-*.exe\`（或 \`.msi\`）。SmartScreen 拦的话点「更多信息 → 仍要运行」。
          - **Windows 免安装版**：\`*-portable.zip\`，解压后双击 \`OfferU/OfferU.exe\`。数据和安装版放在同一个地方，两种可以换着用。
          - **macOS**：\`OfferU-*-arm64.dmg\`（M 系列芯片）或 \`-x64.dmg\`（Intel）。打开后可以直接双击里面的 OfferU，也可以拖进「应用程序」。提示「已损坏」时，在终端执行 \`xattr -dr com.apple.quarantine /Applications/OfferU.app\`。

          Windows 安装版和免安装版都在 GitHub 的干净 Windows 机器上启动过，并确认后端正常。
          EOF
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "OfferU 每日构建（${short_sha}）" \
            --notes-file notes.md \
            assets/windows/*.exe assets/windows/*.msi assets/portable/*.zip assets/macos/*/*.dmg
