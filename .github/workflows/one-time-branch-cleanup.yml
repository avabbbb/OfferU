name: One-time stale branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[branch-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete reviewed stale branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "ci/one-click-macos-dmg-20260927"
            "codex/harness-agent"
            "codex/main-green-2026-09-24"
            "docs/align-current-product-north-star-20260923"
            "docs/first-use-dogfood-entry-20260925"
            "docs/job-workspace-product-model-20260923-v2"
            "docs/proactive-career-director-20260925"
            "docs/real-agent-native-e2e-guidance"
            "docs/skill-workspace-product-story"
            "docs/zero-setup-onboarding-20260922"
            "eval/real-omp-rpc-runner"
            "eval/real-omp-rpc-runner-v2-staging"
            "feat/action-connector-registry"
            "feat/guided-career-skill-ecosystem-20260922"
            "fix/evidence-gap-language"
            "fix/live-eval-trusted-execution"
            "fix/skill-route-optional-labels"
            "refactor/tool-surface-v2"
          )

          for branch in "${branches[@]}"; do
            encoded=$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["BRANCH"], safe=""))' BRANCH="$branch" 2>/dev/null || true)
            if [[ -z "$encoded" ]]; then
              encoded=$(printf '%s' "$branch" | sed 's#/#%2F#g')
            fi
            if gh api "repos/$REPO/git/ref/heads/$encoded" >/dev/null 2>&1; then
              echo "Deleting $branch"
              gh api --method DELETE "repos/$REPO/git/refs/heads/$encoded"
            else
              echo "Already absent: $branch"
            fi
          done
