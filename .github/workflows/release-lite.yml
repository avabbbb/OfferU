name: Release lite package

on:
  push:
    tags: ["v*-lite"]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check tag matches the app version
        run: |
          version=$(node -p 'require("./frontend/package.json").version')
          test "${GITHUB_REF_NAME}" = "v${version}-lite" || { echo "tag ${GITHUB_REF_NAME} != v${version}-lite"; exit 1; }
          node scripts/release/audit_version_consistency.mjs --repo-root .
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: backend-ts
      - run: node backend-ts/scripts/build_lite.mjs
      - name: Install from the package and check the main path
        run: |
          npm install -g dist-lite/offeru-lite-*.tgz
          export OFFERU_DATA_DIR="$RUNNER_TEMP/offeru"
          offeru start --no-browser > "$RUNNER_TEMP/start.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8766/api/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8766/api/health | grep -q '"runtime":"node"'
          curl -sf http://127.0.0.1:8766/ | grep -q OfferU
          offeru doctor --pretty | tee "$RUNNER_TEMP/doctor.json"
          grep -q '"ok": true' "$RUNNER_TEMP/doctor.json"
      - name: Show start log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/start.log" || true
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-lite/*.tgz \
            --title "OfferU $GITHUB_REF_NAME" \
            --notes "Node >= 22.19: npm install -g https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename dist-lite/*.tgz) && offeru start"
