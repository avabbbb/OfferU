name: Deploy to Cloudflare Workers

# Pushes to main publish the web build to the `offeru` Worker (offeru.avabbbb.com).
# Needs repo secret CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 698d3643700adbbc8dcbe83c5440d458
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend-ts/package-lock.json

      - name: Install frontend
        run: npm ci
        working-directory: frontend

      - name: Install backend-ts
        run: npm ci
        working-directory: backend-ts

      - name: Build web bundle
        run: npm run build:web
        working-directory: frontend

      - name: Deploy Worker
        run: npx wrangler deploy
        working-directory: backend-ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test
        run: |
          sleep 10
          curl -fsS -o /dev/null -w "index %{http_code} %{content_type}\n" https://offeru.avabbbb.com/
