# Security updates only: version-update PRs are disabled (open-pull-requests-limit: 0).
# Security fixes per directory are grouped into one PR so lockfile bumps do not conflict.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      extension-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /agent-runtime
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      agent-runtime-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      backend-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /frontend/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      tauri-security:
        applies-to: security-updates
        patterns: ["*"]
