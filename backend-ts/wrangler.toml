# OfferU web on Cloudflare Workers (free plan). Stateless: no D1 / KV / DO / R2.
# Build the frontend first (npm run build:web), then `npx wrangler deploy`.
name = "offeru"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
# HashRouter app: unknown paths fall back to index.html.
not_found_handling = "single-page-application"
# Only the model relay runs the Worker script first. Everything else is a static asset
# (free, not counted as a Worker invocation). The web page answers /api/* itself
# (frontend/src/lib/local); a stray non-navigation /api/* fetch that matches no asset still
# falls through to the Worker, which answers /api/health and 501 for the rest.
run_worker_first = ["/llm-proxy"]

[vars]
# LLM_PROXY = "off"                       # disable the model relay
# LLM_PROXY_EXTRA_HOSTS = "llm.example.com" # allow a self-hosted gateway
