<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="面向校招求职者的 AI 工作台，支持岗位筛选、简历定制与投递跟进。"
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>OfferU | 求职工作台</title>
  </head>
  <body>
    <div id="root">
      <!-- 内联 splash：Vite 打包 JS 加载完成前即渲染，React mount 时自动替换。奶蛙托腮思考 + 思考气泡。 -->
      <style>
        .offeru-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #f6f8f9; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        .naiwa-think { position: relative; width: 96px; height: 96px; }
        .naiwa-think__face { width: 100%; height: 100%; transform-origin: 50% 90%; animation: naiwa-ponder 2.8s ease-in-out infinite; user-select: none; -webkit-user-drag: none; }
        .naiwa-think__bubble { position: absolute; top: -10px; right: -26px; display: flex; gap: 4px; padding: 6px 8px; border-radius: 999px; background: #fff; box-shadow: 0 2px 8px rgba(17, 24, 39, 0.1); }
        .naiwa-think__bubble::after { content: ""; position: absolute; left: 2px; bottom: -6px; width: 7px; height: 7px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(17, 24, 39, 0.08); }
        .naiwa-think__bubble i { width: 6px; height: 6px; border-radius: 50%; background: #5b3a1e; opacity: 0.25; animation: naiwa-dot 1.2s ease-in-out infinite; }
        .naiwa-think__bubble i:nth-child(2) { animation-delay: 0.2s; }
        .naiwa-think__bubble i:nth-child(3) { animation-delay: 0.4s; }
        .offeru-splash__text { color: #5f6f76; font-size: 14px; letter-spacing: 0.02em; }
        @keyframes naiwa-ponder { 0%, 100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-2px); } }
        @keyframes naiwa-dot { 0%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
        @media (prefers-reduced-motion: reduce) { .naiwa-think__face, .naiwa-think__bubble i { animation: none; opacity: 1; } }
      </style>
      <div class="offeru-splash" role="status" aria-label="OfferU 正在加载">
        <div class="naiwa-think">
          <img class="naiwa-think__face" src="/mascot/naiwa-thinking.webp" alt="" width="96" height="96" />
          <span class="naiwa-think__bubble" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <div class="offeru-splash__text">奶蛙正在打开你的求职工作台…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
