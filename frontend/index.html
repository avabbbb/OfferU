<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="面向校招求职者的 AI 工作台，支持岗位筛选、简历定制与投递跟进。"
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>OfferU | 求职工作台</title>
  </head>
  <body>
    <div id="root">
      <!-- 内联 splash：Vite 打包 JS 加载完成前即渲染，React mount 时自动替换。奶蛙托腮思考 + 思考气泡。 -->
      <style>
        /* v3 Glass, copied from design-tokens.css because no CSS has loaded yet: --ou-bg-wash canvas, a
           --ou-glass-menu card with --ou-elev-menu, text --ou-neutral-11. Keep in sync with the tokens. */
        .offeru-splash { position: fixed; inset: 0; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
          background:
            radial-gradient(110% 80% at 0% 0%, rgba(201, 214, 242, 0.95) 0%, rgba(201, 214, 242, 0) 60%),
            radial-gradient(110% 90% at 100% 100%, rgba(246, 227, 210, 0.95) 0%, rgba(246, 227, 210, 0) 62%),
            linear-gradient(135deg, #dfe6f5 0%, #eeecf1 48%, #f6e9df 100%); }
        .offeru-splash__card { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 32px 40px 26px; border-radius: 22px;
          background: rgba(255, 255, 255, 0.7); -webkit-backdrop-filter: blur(40px) saturate(170%); backdrop-filter: blur(40px) saturate(170%);
          box-shadow: 0 0 0 0.5px rgba(60, 50, 80, 0.07), 0 2px 6px rgba(60, 50, 80, 0.05), 0 24px 60px rgba(60, 50, 80, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.7);
          animation: offeru-splash-in 320ms cubic-bezier(0.32, 0.72, 0, 1) both; }
        .offeru-splash__text { color: #69625d; font-size: 14px; letter-spacing: 0.02em; }
        .offeru-splash__bar { position: relative; width: 140px; height: 4px; overflow: hidden; border-radius: 999px; background: rgba(60, 50, 80, 0.085); }
        .offeru-splash__bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: inherit; background: #231d19; animation: offeru-splash-bar 1.4s cubic-bezier(0.2, 0, 0, 1) infinite; }
        @keyframes offeru-splash-in { from { opacity: 0; transform: scale(0.96) translateY(6px); } to { opacity: 1; transform: none; } }
        @keyframes offeru-splash-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        @media (prefers-reduced-motion: reduce) { .offeru-splash__card, .offeru-splash__bar::after { animation: none; } .offeru-splash__bar::after { width: 100%; opacity: 0.25; } }
        .naiwa-think { position: relative; display: inline-block; width: var(--naiwa-size, 72px); height: var(--naiwa-size, 72px); flex-shrink: 0; }
        .naiwa-think__svg { display: block; width: 100%; height: 100%; overflow: visible; }
        .naiwa-think .nw-head { transform-box: view-box; transform-origin: 512px 900px; animation: nw-sway 3.6s ease-in-out infinite; }
        .naiwa-think .nw-pupil { fill: #1a1b1b; transform-box: fill-box; transform-origin: center; animation: nw-look 3.6s ease-in-out infinite; }
        .naiwa-think .nw-lid rect { fill: #fbd97b; }
        .naiwa-think .nw-lid line { stroke: #1a1b1b; stroke-width: 26; stroke-linecap: round; }
        .naiwa-think .nw-lid { animation: nw-lid 3.6s ease-in-out infinite; }
        .naiwa-think .nw-mouth { stroke: #1a1b1b; stroke-width: 30; stroke-linecap: round; transform-box: view-box; transform-origin: 495px 553px; animation: nw-hmm 3.6s ease-in-out infinite; }
        .naiwa-think__bubble { position: absolute; top: -12%; right: -30%; display: flex; gap: 4px; padding: 5px 7px; border-radius: 999px; background: #fff; box-shadow: 0 2px 8px rgba(17, 24, 39, 0.1); }
        .naiwa-think__bubble::after { content: ""; position: absolute; left: 2px; bottom: -6px; width: 7px; height: 7px; border-radius: 50%; background: #fff; }
        .naiwa-think__bubble i { width: 5px; height: 5px; border-radius: 50%; background: #5b3a1e; opacity: 0.25; animation: nw-dot 1.2s ease-in-out infinite; }
        .naiwa-think__bubble i:nth-child(2) { animation-delay: 0.2s; }
        .naiwa-think__bubble i:nth-child(3) { animation-delay: 0.4s; }
        @keyframes nw-sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
        @keyframes nw-look { 0%, 8% { transform: translate(0, 0); } 18%, 44% { transform: translate(18px, -24px); } 47% { transform: translate(18px, -24px) scaleY(0.06); } 50% { transform: translate(18px, -24px); } 56%, 76% { transform: translate(-16px, -22px); } 88%, 100% { transform: translate(0, 0); } }
        @keyframes nw-lid { 0%, 8% { transform: translateY(0); } 18% { transform: translateY(70px); } 44% { transform: translateY(70px); } 47% { transform: translateY(142px); } 50% { transform: translateY(70px); } 76% { transform: translateY(70px); } 88%, 100% { transform: translateY(0); } }
        @keyframes nw-hmm { 0%, 8% { transform: rotate(0deg); } 18%, 44% { transform: rotate(-7deg) translateX(-6px); } 56%, 76% { transform: rotate(5deg) translateX(8px); } 88%, 100% { transform: rotate(0deg); } }
        @keyframes nw-dot { 0%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
        @media (prefers-reduced-motion: reduce) { .naiwa-think .nw-head, .naiwa-think .nw-pupil, .naiwa-think .nw-lid, .naiwa-think .nw-mouth, .naiwa-think__bubble i { animation: none; } .naiwa-think__bubble i { opacity: 1; } }
      </style>
      <div class="offeru-splash" role="status" aria-label="OfferU 正在加载">
       <div class="offeru-splash__card">
        <div class="naiwa-think" style="--naiwa-size: 96px">
          <svg class="naiwa-think__svg" viewBox="0 0 1024 1024" aria-hidden="true">
            <defs>
              <clipPath id="nw-eye-l"><circle cx="222" cy="328" r="126" /></clipPath>
              <clipPath id="nw-eye-r"><circle cx="800" cy="386" r="126" /></clipPath>
            </defs>
            <g class="nw-head">
              <image href="/mascot/naiwa-think-base.webp" width="1024" height="1024" />
              <g clip-path="url(#nw-eye-l)">
                <circle class="nw-pupil" cx="222" cy="330" r="78" />
                <g class="nw-lid"><rect x="80" y="-80" width="290" height="268" /><line x1="80" y1="188" x2="370" y2="188" /></g>
              </g>
              <g clip-path="url(#nw-eye-r)">
                <circle class="nw-pupil" cx="800" cy="387" r="79" />
                <g class="nw-lid"><rect x="660" y="-22" width="290" height="268" /><line x1="660" y1="246" x2="950" y2="246" /></g>
              </g>
              <line class="nw-mouth" x1="380" y1="537" x2="610" y2="570" />
            </g>
          </svg>
          <span class="naiwa-think__bubble" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <div class="offeru-splash__text">奶蛙正在打开你的求职工作台…</div>
        <div class="offeru-splash__bar" aria-hidden="true"></div>
       </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
