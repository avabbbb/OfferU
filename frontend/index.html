<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="面向校招求职者的 AI 工作台，支持岗位筛选、简历定制与投递跟进。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>OfferU | 求职工作台</title>
  </head>
  <body>
    <div id="root">
      <!-- 内联 splash：Vite 打包 JS 加载完成前即渲染，React mount 时自动替换。 -->
      <style>
        .offeru-splash {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #f6f8f9;
          font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .offeru-splash__logo {
          width: 56px;
          height: 56px;
          border-radius: 14px;
          background: #111827;
          display: flex;
          align-items: center;
          justify-content: center;
          animation: offeru-splash-pulse 1.6s ease-in-out infinite;
        }
        .offeru-splash__logo svg {
          width: 32px;
          height: 32px;
        }
        .offeru-splash__text {
          color: #5f6f76;
          font-size: 14px;
          letter-spacing: 0.02em;
        }
        @keyframes offeru-splash-pulse {
          0%,
          100% {
            transform: scale(1);
            opacity: 1;
          }
          50% {
            transform: scale(0.94);
            opacity: 0.82;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .offeru-splash__logo {
            animation: none;
          }
        }
      </style>
      <div class="offeru-splash" role="status" aria-label="OfferU 正在加载">
        <div class="offeru-splash__logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M20 16h24v8H29v8h13v8H29v8h15v8H20z" fill="#fff" />
          </svg>
        </div>
        <div class="offeru-splash__text">OfferU 求职工作台加载中…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
