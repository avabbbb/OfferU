# =============================================
# OfferU - Docker Compose 本地开发编排
# =============================================
# 一键启动所有服务：PostgreSQL + FastAPI 后端 + Vite 前端
# 使用方式：docker compose up -d
# =============================================

services:
  # ---- PostgreSQL 数据库 ----
  db:
    image: postgres:16-alpine
    container_name: offeru-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-offeru}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Docker Compose}
      POSTGRES_DB: ${DB_NAME:-offeru}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-offeru}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- FastAPI 后端 ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: offeru-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-offeru}:${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Docker Compose}@db:5432/${DB_NAME:-offeru}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - APIFY_API_KEY=${APIFY_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-qwen}
      - LLM_MODEL=${LLM_MODEL:-qwen-flash}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env before starting Docker Compose}
      - CORS_ORIGINS=http://localhost:7410,http://127.0.0.1:7410
    command: uvicorn app.main:app --host 0.0.0.0 --port 8765 --reload --reload-dir /app
    ports:
      - "8765:8765"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # ---- Vite 前端 ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: offeru-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://127.0.0.1:8765
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "7410:7410"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  frontend_node_modules:
