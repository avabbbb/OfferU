<!-- 新版 QQ 邮箱（wx.mail.qq.com）写信页精简结构：按标签文字排的行、可编辑正文、附件文件框。 -->
<div class="frame-main">
  <div class="xmail-compose compose-wrap">
    <div class="compose_row"><label>收件人</label><div class="compose_receiver"><input type="text" class="xmail-ui-input"></div></div>
    <div class="compose_row"><label>抄送</label><div><input type="text" aria-label="抄送人"></div></div>
    <div class="compose_row"><label>主题</label><div class="compose_subject"><input type="text"></div></div>
    <div class="compose_attach"><span>添加附件</span><input type="file" multiple></div>
    <div class="compose_editor"><div contenteditable="true" class="xmail-editor-body"></div></div>
    <button type="button" class="xmail-ui-btn" data-testid="send">发送</button>
  </div>
</div>
