<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Job detail with embedded search widget</title>
</head>
<body>
  <main>
    <section data-testid="job-detail">
      <h1 data-testid="job-title">Platform Engineer</h1>
      <p data-testid="company-name">Acme Fixtures Ltd</p>
      <div data-testid="job-description">Maintains the synthetic harness.</div>
    </section>
    <aside data-testid="job-search">
      <input placeholder="search other jobs">
    </aside>
  </main>
</body>
</html>
